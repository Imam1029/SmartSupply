# Render Blueprint -- push this repo and click "New +" -> "Blueprint" in
# the Render dashboard to provision both services below in one go,
# instead of configuring the web service and database by hand.
# https://render.com/docs/blueprint-spec

databases:
  - name: smartwater-db
    plan: free
    databaseName: smartwater
    user: smartwater

services:
  - type: web
    name: smartwater
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn smartwater.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""  # RENDER_EXTERNAL_HOSTNAME is picked up automatically; add a custom domain here later
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ""  # same -- only needed for a custom domain
      - key: DATABASE_URL
        fromDatabase:
          name: smartwater-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Auto-creates the first admin login on deploy (see
      # core/management/commands/create_admin.py) -- needed since the free
      # plan has no Shell to run createsuperuser by hand. Find the
      # generated password in Render dashboard -> this service ->
      # Environment -> DJANGO_SUPERUSER_PASSWORD (click to reveal).
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PHONE
        value: "01700000000"  # change to your real number after first login
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
{% extends "base.html" %}
{% block title %}ঠিকানা এডিট করুন{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>ঠিকানা এডিট করুন</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field {% if field.name == 'is_default' %}checkbox-field{% endif %}">
        {% if field.name != 'is_default' %}<label>{{ field.label }}</label>{% endif %}
        {{ field }}
        {% if field.name == 'is_default' %}<label>{{ field.label }}</label>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">সংরক্ষণ করুন</button>
    <a href="{% url 'accounts:addresses' %}" class="btn btn-outline">বাতিল</a>
  </form>
</div>
{% endblock %}

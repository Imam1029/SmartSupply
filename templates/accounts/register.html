{% extends "base.html" %}
{% block title %}রেজিস্ট্রেশন{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>নতুন অ্যাকাউন্ট</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="alert alert-error">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">OTP পাঠান</button>
  </form>
  <p style="margin-top:14px;">আগে থেকে অ্যাকাউন্ট আছে? <a href="{% url 'accounts:login' %}">লগইন করুন</a></p>
</div>
{% endblock %}
